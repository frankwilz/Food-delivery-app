name: Tests

# Runs on every push to any branch and on every pull request, so each feature branch
# and PR shows a pass/fail check in the Actions tab
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the frontend HTTP and session client
        run: node --test tests/frontend/*.test.mjs

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Check committed data was not modified by the tests
        run: |
          git diff --exit-code -- data/
          changes="$(git status --porcelain -- data/)"
          if [ -n "$changes" ]; then echo "Tests changed data/:"; echo "$changes"; exit 1; fi
          for name in restaurants menu_items customers carts orders; do test -f "data/$name.json"; done
