<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213d;
    --muted: #5b6577;
    --line: #e3e7ee;
    --bg: #f5f7fa;
    --card: #ffffff;
    --accent: #0f8b6d;
    --accent-dark: #0b6b54;
    --star: #f5a300;
    --closed: #8a93a3;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1120px; margin: 0 auto; padding: .75rem 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 1.25rem; letter-spacing: -.02em; color: var(--accent); }
  .search { flex: 1 1 260px; position: relative; }
  .search input { width: 100%; padding: .65rem 1rem; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
  .btn { border: 0; border-radius: 999px; padding: .6rem 1.1rem; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; }
  .btn:hover { background: var(--accent-dark); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--bg); }

  main { max-width: 1120px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: .5rem 0 1rem; }
  h2 { font-size: 1.25rem; letter-spacing: -.01em; margin: 2rem 0 .75rem; }

  /* Cuisine chips */
  .chips { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .5rem; margin-bottom: .75rem; }
  .chip { flex: 0 0 auto; display: flex; align-items: center; gap: .4rem; padding: .45rem .9rem; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 500; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Restaurant grid */
  .count { color: var(--muted); margin: 0 0 .75rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.1rem; }
  .rcard { display: block; background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); transition: box-shadow .15s ease, transform .15s ease; }
  .rcard:hover { box-shadow: 0 8px 22px rgba(20, 33, 61, .12); transform: translateY(-2px); }
  .banner { height: 130px; display: grid; place-items: center; font-size: 3.2rem; position: relative; }
  .rcard.is-closed .banner { filter: grayscale(.85); opacity: .8; }
  .badge { position: absolute; top: .6rem; left: .6rem; padding: .15rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 700; background: #fff; }
  .badge.open { color: var(--accent-dark); }
  .badge.closed { color: var(--closed); }
  .rbody { padding: .8rem 1rem 1rem; }
  .rname { font-weight: 800; font-size: 1.05rem; margin: 0; }
  .rmeta { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .9rem; margin-top: .15rem; }
  .rating { display: inline-flex; align-items: center; gap: .2rem; font-weight: 700; color: var(--ink); }
  .rating::before { content: "\2605"; color: var(--star); }
  .addr { color: var(--muted); font-size: .85rem; margin-top: .35rem; }

  /* Restaurant page */
  .back { display: inline-flex; align-items: center; gap: .3rem; margin: .25rem 0 .75rem; font-weight: 700; color: var(--muted); }
  .back:hover { color: var(--ink); }
  .hero { border-radius: 16px; overflow: hidden; background: var(--card); border: 1px solid var(--line); }
  .hero .banner { height: 190px; font-size: 5rem; }
  .hero-body { padding: 1rem 1.25rem 1.25rem; }
  .hero-body h1 { margin: 0 0 .25rem; }
  .facts { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; color: var(--muted); }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: .9rem; }
  .mitem { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem; display: flex; justify-content: space-between; gap: 1rem; }
  .mname { font-weight: 700; margin: 0; }
  .mdesc { color: var(--muted); font-size: .9rem; margin: .2rem 0 0; }
  .mprice { font-weight: 800; white-space: nowrap; }

  /* States */
  .state { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 2rem 1rem; text-align: center; color: var(--muted); }
  .state.error { color: var(--danger); border-color: var(--danger); }
  .skeleton { height: 230px; border-radius: 14px; background: linear-gradient(90deg, #eceff4 25%, #f6f8fb 50%, #eceff4 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } .rcard { transition: none; } }

  /* Dialog */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(440px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(20, 33, 61, .45); }
  .dlg { padding: 1.25rem 1.5rem 1.5rem; }
  .dlg h2 { margin-top: 0; }
  form { display: grid; gap: .8rem; }
  label { display: grid; gap: .25rem; font-weight: 500; font-size: .9rem; }
  label.inline { display: flex; align-items: center; gap: .5rem; }
  .field { padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 10px; }
  .row { display: flex; gap: .6rem; justify-content: flex-end; margin-top: .4rem; }
  .form-msg { min-height: 1.2rem; font-size: .9rem; }
  .form-msg.error { color: var(--danger); }

  /* Toast and footer */
  .toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: .7rem 1.2rem; border-radius: 999px; font-weight: 500; z-index: 10; }
  footer { max-width: 1120px; margin: 0 auto; padding: 0 1rem 2rem; color: var(--muted); font-size: .85rem; }
  footer input { padding: .3rem .6rem; border: 1px solid var(--line); border-radius: 8px; width: 15rem; }
</style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/">Food Delivery</a>
      <div class="search" id="searchWrap">
        <input id="search" type="search" placeholder="Search restaurants, cuisines or addresses" aria-label="Search restaurants">
      </div>
      <button class="btn" id="openCreate" type="button">Add restaurant</button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer>
    <label class="inline">API address <input id="apiBase" value="http://127.0.0.1:8000"></label>
  </footer>

  <dialog id="createDialog" aria-labelledby="createTitle">
    <div class="dlg">
      <h2 id="createTitle">Add a restaurant</h2>
      <form id="createForm">
        <label>Name <input class="field" name="name" required></label>
        <label>Cuisine <input class="field" name="cuisine" required placeholder="e.g. Italian"></label>
        <label>Address <input class="field" name="address" required></label>
        <label>Rating (0 to 5) <input class="field" name="rating" type="number" min="0" max="5" step="0.1" value="4.0" required></label>
        <label class="inline"><input name="is_open" type="checkbox" checked> Currently open</label>
        <div class="form-msg" id="formMsg" aria-live="polite"></div>
        <div class="row">
          <button class="btn ghost" type="button" id="cancelCreate">Cancel</button>
          <button class="btn" type="submit">Create restaurant</button>
        </div>
      </form>
    </div>
  </dialog>

<script>
  const $ = (id) => document.getElementById(id);
  const app = $("app");
  const state = { restaurants: null, cuisine: "All", query: "" };

  const api = (path) => $("apiBase").value.replace(/\/$/, "") + path;

  async function request(path, options) {
    const res = await fetch(api(path), options);
    if (!res.ok) {
      let detail = res.statusText;
      try {
        const body = await res.json();
        detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
      } catch (_) {}
      throw new Error(res.status + " " + detail);
    }
    return res.json();
  }

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "style") node.style.cssText = v;
      else if (k === "class") node.className = v;
      else node[k] = v;
    });
    children.flat().forEach((c) => node.append(c instanceof Node ? c : document.createTextNode(c)));
    return node;
  }

  // Visual helpers: no image field in the API, so each cuisine gets a color and emoji.
  const EMOJI = [
    [/pizza|italian/i, "\u{1F355}"], [/burger|american|grill|bbq/i, "\u{1F354}"],
    [/sushi|japan|ramen/i, "\u{1F363}"], [/indian|curry/i, "\u{1F35B}"],
    [/mexic|taco/i, "\u{1F32E}"], [/chinese/i, "\u{1F961}"], [/thai|viet|noodle/i, "\u{1F35C}"],
    [/salad|health|vegan|vegetarian/i, "\u{1F957}"], [/dessert|bakery|cake|sweet/i, "\u{1F370}"],
    [/coffee|cafe|tea/i, "\u2615"], [/chicken|wings/i, "\u{1F357}"], [/seafood|fish/i, "\u{1F990}"],
    [/african|nigerian|jollof/i, "\u{1F372}"], [/breakfast|brunch/i, "\u{1F95E}"],
  ];
  const emojiFor = (cuisine) => (EMOJI.find(([re]) => re.test(cuisine || "")) || [null, "\u{1F37D}\uFE0F"])[1];
  const hueFor = (s) => [...String(s || "")].reduce((a, c) => a + c.charCodeAt(0), 0) * 37 % 360;
  const bannerStyle = (cuisine) => {
    const h = hueFor(cuisine);
    return `background: linear-gradient(135deg, hsl(${h} 75% 90%), hsl(${h} 65% 78%));`;
  };
  const money = (p) => (typeof p === "number" ? "$" + p.toFixed(2) : String(p ?? ""));

  function banner(r, extraClass = "") {
    return el("div", { class: "banner " + extraClass, style: bannerStyle(r.cuisine) },
      el("span", { "aria-hidden": "true" }, emojiFor(r.cuisine)),
      el("span", { class: "badge " + (r.is_open ? "open" : "closed") }, r.is_open ? "Open now" : "Closed"));
  }

  // ---------- Home ----------
  async function loadRestaurants() {
    state.restaurants = await request("/restaurants");
  }

  function filtered() {
    const q = state.query.toLowerCase();
    return state.restaurants.filter((r) =>
      (state.cuisine === "All" || r.cuisine === state.cuisine) &&
      (!q || [r.name, r.cuisine, r.address].some((v) => String(v).toLowerCase().includes(q))));
  }

  function renderGrid() {
    const holder = $("gridHolder");
    if (!holder) return;
    holder.textContent = "";
    const list = filtered();
    holder.append(el("p", { class: "count" }, list.length + (list.length === 1 ? " restaurant" : " restaurants")));
    if (!list.length) {
      holder.append(el("div", { class: "state" }, "No restaurants match your search. Try a different word or clear the cuisine filter."));
      return;
    }
    holder.append(el("div", { class: "grid" }, list.map((r) =>
      el("a", { class: "rcard" + (r.is_open ? "" : " is-closed"), href: "#/restaurant/" + r.id },
        banner(r),
        el("div", { class: "rbody" },
          el("p", { class: "rname" }, r.name),
          el("div", { class: "rmeta" }, el("span", { class: "rating" }, String(r.rating)), el("span", {}, r.cuisine)),
          el("div", { class: "addr" }, r.address))))));
  }

  function renderChips() {
    const holder = $("chips");
    if (!holder) return;
    holder.textContent = "";
    const cuisines = ["All", ...new Set(state.restaurants.map((r) => r.cuisine).filter(Boolean))].sort((a, b) =>
      a === "All" ? -1 : b === "All" ? 1 : a.localeCompare(b));
    cuisines.forEach((c) => {
      const chip = el("button", { class: "chip", type: "button", "aria-pressed": String(state.cuisine === c) },
        c === "All" ? "\u{1F37D}\uFE0F" : emojiFor(c), c);
      chip.addEventListener("click", () => { state.cuisine = c; renderChips(); renderGrid(); });
      holder.append(chip);
    });
  }

  async function showHome() {
    $("searchWrap").hidden = false;
    app.textContent = "";
    app.append(el("h1", {}, "Restaurants near you"), el("div", { class: "chips", id: "chips" }), el("div", { id: "gridHolder" }));
    $("gridHolder").append(el("div", { class: "grid" }, [1, 2, 3, 4, 5, 6].map(() => el("div", { class: "skeleton" }))));
    try {
      if (!state.restaurants) await loadRestaurants();
      renderChips();
      renderGrid();
    } catch (err) {
      $("gridHolder").textContent = "";
      $("gridHolder").append(el("div", { class: "state error" },
        "Could not load restaurants (" + err.message + "). Check that the backend is running and the API address below is right."));
    }
  }

  // ---------- Restaurant page ----------
  async function showDetail(id) {
    $("searchWrap").hidden = true;
    app.textContent = "";
    app.append(el("a", { class: "back", href: "#/" }, "\u2190 All restaurants"), el("div", { class: "skeleton", style: "height:300px" }));
    let r;
    try {
      r = await request("/restaurants/" + id);
    } catch (err) {
      app.textContent = "";
      app.append(el("a", { class: "back", href: "#/" }, "\u2190 All restaurants"),
        el("div", { class: "state error" }, err.message.startsWith("404")
          ? "That restaurant doesn't exist. It may have been removed."
          : "Could not load this restaurant (" + err.message + ")."));
      return;
    }
    const menuHolder = el("div", {}, el("div", { class: "skeleton", style: "height:100px" }));
    app.textContent = "";
    app.append(
      el("a", { class: "back", href: "#/" }, "\u2190 All restaurants"),
      el("section", { class: "hero" },
        banner(r),
        el("div", { class: "hero-body" },
          el("h1", {}, r.name),
          el("div", { class: "facts" },
            el("span", { class: "rating" }, r.rating + " rating"),
            el("span", {}, r.cuisine),
            el("span", {}, r.address),
            el("span", {}, r.is_open ? "Open now" : "Closed right now")))),
      el("h2", {}, "Menu"),
      menuHolder);
    try {
      const items = await request("/restaurants/" + id + "/menu");
      menuHolder.textContent = "";
      if (!items.length) {
        menuHolder.append(el("div", { class: "state" }, "This restaurant hasn't added any menu items yet."));
        return;
      }
      const groups = {};
      items.forEach((m) => { (groups[m.category || ""] = groups[m.category || ""] || []).push(m); });
      Object.entries(groups).forEach(([cat, group]) => {
        if (cat) menuHolder.append(el("h2", {}, cat));
        menuHolder.append(el("div", { class: "menu-grid" }, group.map((m) =>
          el("div", { class: "mitem" },
            el("div", {}, el("p", { class: "mname" }, m.name), m.description ? el("p", { class: "mdesc" }, m.description) : ""),
            el("div", { class: "mprice" }, money(m.price))))));
      });
    } catch (err) {
      menuHolder.textContent = "";
      menuHolder.append(el("div", { class: "state error" }, "Could not load the menu (" + err.message + ")."));
    }
  }

  // ---------- Routing ----------
  function route() {
    const m = location.hash.match(/^#\/restaurant\/(\d+)/);
    if (m) showDetail(m[1]); else showHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);

  // ---------- Search ----------
  $("search").addEventListener("input", (e) => { state.query = e.target.value; renderGrid(); });
  $("apiBase").addEventListener("change", () => { state.restaurants = null; route(); });

  // ---------- Create restaurant ----------
  const dialog = $("createDialog");
  $("openCreate").addEventListener("click", () => { $("formMsg").textContent = ""; dialog.showModal(); });
  $("cancelCreate").addEventListener("click", () => dialog.close());

  function toast(text) {
    const t = el("div", { class: "toast", role: "status" }, text);
    document.body.append(t);
    setTimeout(() => t.remove(), 3000);
  }

  $("createForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("formMsg");
    msg.className = "form-msg"; msg.textContent = "Saving...";
    const f = e.target.elements;
    const body = {
      name: f.name.value.trim(),
      cuisine: f.cuisine.value.trim(),
      address: f.address.value.trim(),
      rating: parseFloat(f.rating.value),
      is_open: f.is_open.checked,
    };
    try {
      const created = await request("/restaurants", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      e.target.reset();
      dialog.close();
      state.restaurants = null;
      toast("Added " + created.name);
      if (location.hash && location.hash !== "#/") location.hash = "#/"; else route();
    } catch (err) {
      msg.className = "form-msg error";
      msg.textContent = "Could not create the restaurant: " + err.message;
    }
  });

  route();
</script>
</body>
</html>
